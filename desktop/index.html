<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Obzue Desk v0.1</title>
  <meta name="description" content="ObzueAI browser desk. Not a native OS.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/video.js@8.10.0/dist/video-js.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="boot-screen" role="status">
    <div class="boot-logo" aria-hidden="true"></div>
    <div class="loading-bar"><span></span></div>
    <p class="boot-text">Loading Obzue Desk</p>
    <p class="boot-sub">v0.1.0 — browser desk. Not a native OS.</p>
  </div>
  <div id="desktop" hidden>
    <div id="desktop-icons"></div>
    <div id="windows"></div>
    <div id="start-menu" class="hidden" role="menu"></div>
    <div id="context-menu" class="hidden" role="menu"></div>
    <div id="taskbar">
      <button type="button" id="start-menu-button" aria-label="Start">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M12 6v6l4 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <div id="task-buttons"></div>
      <div id="system-tray">
        <div id="volume-control">
          <button type="button" id="volume-toggle" aria-label="Volume">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 10v4h3l5 4V6L7 10H4z" fill="currentColor"/></svg>
          </button>
          <div id="volume-slider-container">
            <label for="master-volume">Master</label>
            <input type="range" id="master-volume" min="0" max="100" value="100">
          </div>
        </div>
        <span id="version-stamp">v0.1.0</span>
        <time id="clock"></time>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/video.js@8.10.0/dist/video.min.js"></script>
  <script src="os.js"></script>
</body>
</html>
